<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3a;
    --rock: #e85d4a;
    --paper: #4a9eff;
    --scissors: #f5c842;
    --win: #43e97b;
    --lose: #e85d4a;
    --draw: #888;
    --text: #f0f0f5;
    --muted: #666;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,158,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,158,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 700px;
    position: relative;
    z-index: 1;
  }

  /* Title */
  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 8vw, 72px);
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--rock), var(--paper), var(--scissors));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  /* Scoreboard */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    margin-bottom: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .scoreboard::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--rock), var(--paper), var(--scissors));
  }

  .score-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .score-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .score-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    line-height: 1;
    transition: transform 0.15s ease, color 0.3s ease;
  }

  .score-value.bump {
    animation: bump 0.3s ease;
  }

  @keyframes bump {
    0% { transform: scale(1); }
    50% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }

  .score-you .score-value { color: var(--paper); }
  .score-ai .score-value { color: var(--rock); }

  .score-sep {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .sep-line {
    width: 1px;
    height: 20px;
    background: var(--border);
  }

  .sep-text {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .draws-bar {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: 0.15em;
  }

  .draws-bar span {
    color: var(--draw);
    font-size: 13px;
  }

  /* Arena */
  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: center;
    margin-bottom: 28px;
    min-height: 140px;
  }

  .player-display, .ai-display {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: border-color 0.3s;
  }

  .player-display.win { border-color: var(--win); box-shadow: 0 0 20px rgba(67,233,123,0.15); }
  .player-display.lose { border-color: var(--lose); box-shadow: 0 0 20px rgba(232,93,74,0.15); }
  .player-display.draw { border-color: var(--draw); }

  .ai-display.win { border-color: var(--win); box-shadow: 0 0 20px rgba(67,233,123,0.15); }
  .ai-display.lose { border-color: var(--lose); box-shadow: 0 0 20px rgba(232,93,74,0.15); }
  .ai-display.draw { border-color: var(--draw); }

  .display-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .display-emoji {
    font-size: 52px;
    line-height: 1;
    transition: transform 0.3s ease;
  }

  .display-emoji.reveal {
    animation: reveal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes reveal {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .display-name {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--text);
    text-transform: uppercase;
    min-height: 16px;
  }

  /* Result badge */
  .arena-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .vs-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--border);
    letter-spacing: 0.1em;
  }

  .result-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.15em;
    padding: 4px 12px;
    border-radius: 2px;
    transition: all 0.3s ease;
    min-width: 70px;
    text-align: center;
    opacity: 0;
  }

  .result-badge.show { opacity: 1; }
  .result-badge.WIN { background: var(--win); color: #000; }
  .result-badge.LOSE { background: var(--lose); color: #fff; }
  .result-badge.DRAW { background: var(--draw); color: #fff; }

  /* Choices */
  .choices-label {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .choices {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .choice-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.18s ease;
    flex: 1;
    max-width: 160px;
    position: relative;
    overflow: hidden;
  }

  .choice-btn::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .choice-btn[data-choice="rock"]::before { background: var(--rock); }
  .choice-btn[data-choice="paper"]::before { background: var(--paper); }
  .choice-btn[data-choice="scissors"]::before { background: var(--scissors); }

  .choice-btn:hover {
    transform: translateY(-3px);
    border-color: rgba(255,255,255,0.2);
  }
  .choice-btn:hover::before { opacity: 1; }

  .choice-btn:hover[data-choice="rock"] { box-shadow: 0 8px 24px rgba(232,93,74,0.2); }
  .choice-btn:hover[data-choice="paper"] { box-shadow: 0 8px 24px rgba(74,158,255,0.2); }
  .choice-btn:hover[data-choice="scissors"] { box-shadow: 0 8px 24px rgba(245,200,66,0.2); }

  .choice-btn:active { transform: translateY(0); }

  .choice-btn.disabled { opacity: 0.4; pointer-events: none; }

  .choice-emoji { font-size: 36px; }

  .choice-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* History */
  .history-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
  }

  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .history-title {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }

  .reset-btn:hover { border-color: var(--lose); color: var(--lose); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 180px;
    overflow-y: auto;
  }

  .history-list::-webkit-scrollbar { width: 3px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); }

  .history-empty {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 20px 0;
    letter-spacing: 0.1em;
  }

  .history-row {
    display: grid;
    grid-template-columns: 28px 1fr auto 1fr 50px;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 2px;
    background: rgba(255,255,255,0.02);
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .history-num { color: var(--muted); font-size: 10px; }
  .history-you { color: var(--paper); }
  .history-ai { color: var(--rock); text-align: right; }
  .history-sep { text-align: center; color: var(--border); }

  .history-result {
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.1em;
    font-weight: 500;
  }

  .history-result.WIN { color: var(--win); }
  .history-result.LOSE { color: var(--lose); }
  .history-result.DRAW { color: var(--draw); }

  /* Win rate bar */
  .rate-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .rate-label { font-size: 10px; color: var(--muted); letter-spacing: 0.15em; white-space: nowrap; }

  .rate-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .rate-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--win), var(--paper));
    border-radius: 2px;
    transition: width 0.5s ease;
    width: 0%;
  }

  .rate-pct { font-size: 11px; color: var(--text); min-width: 36px; text-align: right; }

  /* Streak */
  .streak-row {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
    letter-spacing: 0.1em;
    min-height: 18px;
  }

  .streak-row .streak-val {
    color: var(--win);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
  }
</style>
</head>
<body>
<div class="container">
  <h1 class="title">Rock Paper Scissors</h1>
  <p class="subtitle">vs AI — Math.random()</p>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="score-block score-you">
      <div class="score-label">You</div>
      <div class="score-value" id="score-you">0</div>
    </div>
    <div class="score-sep">
      <div class="sep-line"></div>
      <div class="sep-text">VS</div>
      <div class="sep-line"></div>
    </div>
    <div class="score-block score-ai">
      <div class="score-label">AI</div>
      <div class="score-value" id="score-ai">0</div>
    </div>
    <div class="draws-bar" style="grid-column:1/-1">
      Draws: <span id="score-draws">0</span> &nbsp;|&nbsp; Games: <span id="score-total">0</span>
    </div>
  </div>

  <!-- Arena -->
  <div class="streak-row" id="streak-row"></div>

  <div class="arena">
    <div class="player-display" id="player-display">
      <div class="display-label">You</div>
      <div class="display-emoji" id="player-emoji">❓</div>
      <div class="display-name" id="player-name">—</div>
    </div>
    <div class="arena-center">
      <div class="vs-text">VS</div>
      <div class="result-badge" id="result-badge">—</div>
    </div>
    <div class="ai-display" id="ai-display">
      <div class="display-label">AI</div>
      <div class="display-emoji" id="ai-emoji">🤖</div>
      <div class="display-name" id="ai-name">—</div>
    </div>
  </div>

  <!-- Choices -->
  <div class="choices-label">Choose your move</div>
  <div class="choices">
    <button class="choice-btn" data-choice="rock" onclick="play('rock')">
      <div class="choice-emoji">🪨</div>
      <div class="choice-label">Rock</div>
    </button>
    <button class="choice-btn" data-choice="paper" onclick="play('paper')">
      <div class="choice-emoji">📄</div>
      <div class="choice-label">Paper</div>
    </button>
    <button class="choice-btn" data-choice="scissors" onclick="play('scissors')">
      <div class="choice-emoji">✂️</div>
      <div class="choice-label">Scissors</div>
    </button>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="history-header">
      <div class="history-title">Match History</div>
      <button class="reset-btn" onclick="reset()">Reset All</button>
    </div>
    <div class="history-list" id="history-list">
      <div class="history-empty" id="history-empty">No rounds played yet</div>
    </div>
    <div class="rate-row">
      <div class="rate-label">Win rate</div>
      <div class="rate-bar"><div class="rate-fill" id="rate-fill"></div></div>
      <div class="rate-pct" id="rate-pct">—</div>
    </div>
  </div>
</div>

<script>
  const CHOICES = ['rock', 'paper', 'scissors'];
  const EMOJI = { rock: '🪨', paper: '📄', scissors: '✂️' };
  const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

  const state = {
    you: 0, ai: 0, draws: 0,
    history: [],
    streak: 0, streakType: null,
    locked: false
  };

  function aiPick() {
    // Pure Math.random() — fair 33.3% each
    return CHOICES[Math.floor(Math.random() * 3)];
  }

  function getResult(you, ai) {
    if (you === ai) return 'DRAW';
    return BEATS[you] === ai ? 'WIN' : 'LOSE';
  }

  function play(choice) {
    if (state.locked) return;
    state.locked = true;
    disableBtns(true);

    // Show player choice instantly
    setDisplay('player', choice, null);

    // AI "thinking" — brief delay for drama
    const aiEmoji = document.getElementById('ai-emoji');
    aiEmoji.textContent = '⏳';

    setTimeout(() => {
      const aiChoice = aiPick();
      const result = getResult(choice, aiChoice);

      // Update state
      if (result === 'WIN') { state.you++; updateStreak('WIN'); }
      else if (result === 'LOSE') { state.ai++; updateStreak('LOSE'); }
      else { state.draws++; updateStreak('DRAW'); }

      state.history.unshift({ round: state.history.length + 1, you: choice, ai: aiChoice, result });

      // Update UI
      setDisplay('ai', aiChoice, result === 'WIN' ? 'lose' : result === 'LOSE' ? 'win' : 'draw');
      setDisplay('player', choice, result.toLowerCase());
      showResult(result);
      updateScoreboard();
      addHistoryRow(state.history[0]);
      updateRateBar();
      updateStreak_ui();

      setTimeout(() => {
        state.locked = false;
        disableBtns(false);
        clearResults();
      }, 1100);
    }, 480);
  }

  function setDisplay(who, choice, outcome) {
    const display = document.getElementById(who === 'player' ? 'player-display' : 'ai-display');
    const emojiEl = document.getElementById(who === 'player' ? 'player-emoji' : 'ai-emoji');
    const nameEl = document.getElementById(who === 'player' ? 'player-name' : 'ai-name');

    display.className = (who === 'player' ? 'player-display' : 'ai-display') + (outcome ? ' ' + outcome : '');
    emojiEl.textContent = EMOJI[choice];
    emojiEl.classList.remove('reveal');
    void emojiEl.offsetWidth;
    emojiEl.classList.add('reveal');
    nameEl.textContent = choice.charAt(0).toUpperCase() + choice.slice(1);
  }

  function showResult(result) {
    const badge = document.getElementById('result-badge');
    badge.textContent = result;
    badge.className = 'result-badge show ' + result;
  }

  function clearResults() {
    document.getElementById('result-badge').className = 'result-badge';
    document.getElementById('player-display').className = 'player-display';
    document.getElementById('ai-display').className = 'ai-display';
  }

  function updateScoreboard() {
    const animate = (id, val) => {
      const el = document.getElementById(id);
      el.textContent = val;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    };
    animate('score-you', state.you);
    animate('score-ai', state.ai);
    document.getElementById('score-draws').textContent = state.draws;
    document.getElementById('score-total').textContent = state.history.length;
  }

  function addHistoryRow(entry) {
    const list = document.getElementById('history-list');
    const empty = document.getElementById('history-empty');
    if (empty) empty.remove();

    const row = document.createElement('div');
    row.className = 'history-row';
    row.innerHTML = `
      <span class="history-num">#${entry.round}</span>
      <span class="history-you">${EMOJI[entry.you]} ${entry.you}</span>
      <span class="history-sep">vs</span>
      <span class="history-ai">${entry.ai} ${EMOJI[entry.ai]}</span>
      <span class="history-result ${entry.result}">${entry.result}</span>
    `;
    list.prepend(row);
  }

  function updateRateBar() {
    const total = state.history.length;
    if (!total) return;
    const pct = Math.round((state.you / total) * 100);
    document.getElementById('rate-fill').style.width = pct + '%';
    document.getElementById('rate-pct').textContent = pct + '%';
  }

  function updateStreak(result) {
    if (result === 'DRAW') { state.streak = 0; state.streakType = null; return; }
    if (state.streakType === result) { state.streak++; }
    else { state.streak = 1; state.streakType = result; }
  }

  function updateStreak_ui() {
    const el = document.getElementById('streak-row');
    if (state.streak >= 2 && state.streakType) {
      const icon = state.streakType === 'WIN' ? '🔥' : '❄️';
      el.innerHTML = `${icon} <span class="streak-val">${state.streak}</span> in a row — ${state.streakType.toLowerCase()} streak`;
    } else {
      el.innerHTML = '';
    }
  }

  function disableBtns(disabled) {
    document.querySelectorAll('.choice-btn').forEach(b => {
      b.classList.toggle('disabled', disabled);
    });
  }

  function reset() {
    Object.assign(state, { you: 0, ai: 0, draws: 0, history: [], streak: 0, streakType: null, locked: false });
    document.getElementById('score-you').textContent = '0';
    document.getElementById('score-ai').textContent = '0';
    document.getElementById('score-draws').textContent = '0';
    document.getElementById('score-total').textContent = '0';
    document.getElementById('player-emoji').textContent = '❓';
    document.getElementById('player-name').textContent = '—';
    document.getElementById('ai-emoji').textContent = '🤖';
    document.getElementById('ai-name').textContent = '—';
    document.getElementById('result-badge').className = 'result-badge';
    document.getElementById('player-display').className = 'player-display';
    document.getElementById('ai-display').className = 'ai-display';
    document.getElementById('rate-fill').style.width = '0%';
    document.getElementById('rate-pct').textContent = '—';
    document.getElementById('streak-row').innerHTML = '';
    const list = document.getElementById('history-list');
    list.innerHTML = '<div class="history-empty" id="history-empty">No rounds played yet</div>';
    disableBtns(false);
  }
</script>
</body>
</html>
